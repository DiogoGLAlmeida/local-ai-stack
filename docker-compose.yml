name: local-ai

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui:/app/backend/data
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DEFAULT_MODELS: qwen3.5:9b
      WEBUI_NAME: Local AI

      ENABLE_WEB_SEARCH: "true"
      ENABLE_RAG_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: searxng
      RAG_WEB_SEARCH_ENGINE: searxng
      SEARXNG_QUERY_URL: http://searxng:8080/search?q=<query>
      WEB_SEARCH_RESULT_COUNT: "5"
      RAG_WEB_SEARCH_RESULT_COUNT: "5"

      AUDIO_TTS_ENGINE: openai
      AUDIO_TTS_OPENAI_API_BASE_URL: http://kokoro:8880/v1
      AUDIO_TTS_OPENAI_API_KEY: not-needed
      AUDIO_TTS_MODEL: kokoro
      AUDIO_TTS_VOICE: af_heart

      WHISPER_MODEL: small
    depends_on:
      - searxng
      - kokoro

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
      SEARXNG_SECRET: ${SEARXNG_SECRET}

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: kokoro
    restart: unless-stopped
    ports:
      - "8880:8880"

  vane:
    image: itzcrazykns1337/vane:slim-latest
    container_name: vane
    restart: unless-stopped
    ports:
      - "3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - vane-data:/home/vane/data
    environment:
      SEARXNG_API_URL: http://searxng:8080
    depends_on:
      - searxng

  mcp-youtube:
    image: supercorp/supergateway:uvx
    container_name: mcp-youtube
    restart: unless-stopped
    ports:
      - "127.0.0.1:8101:8000"
    command:
      - --stdio
      - uvx --with "mcp<2" mcp-youtube-transcript
      - --outputTransport
      - streamableHttp
      - --port
      - "8000"
      - --stateful

  mcp-files:
    image: supercorp/supergateway:latest
    container_name: mcp-files
    restart: unless-stopped
    ports:
      - "127.0.0.1:8102:8000"
    volumes:
      - ${DOCUMENTS_PATH}:/data/Documents:ro
      - ${DOWNLOADS_PATH}:/data/Downloads:ro
    command:
      - --stdio
      - npx -y @modelcontextprotocol/server-filesystem /data
      - --outputTransport
      - streamableHttp
      - --port
      - "8000"
      - --stateful

  mcp-time:
    image: supercorp/supergateway:uvx
    container_name: mcp-time
    restart: unless-stopped
    ports:
      - "127.0.0.1:8103:8000"
    command:
      - --stdio
      - uvx mcp-server-time --local-timezone=Europe/Lisbon
      - --outputTransport
      - streamableHttp
      - --port
      - "8000"
      - --stateful

  mcp-wikipedia:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    container_name: mcp-wikipedia
    restart: unless-stopped
    ports:
      - "127.0.0.1:8104:8000"
    entrypoint: ["uvx"]
    command:
      - wikipedia-mcp
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --path
      - /mcp
      - --enable-cache

  mcp-weather:
    image: supercorp/supergateway:uvx
    container_name: mcp-weather
    restart: unless-stopped
    ports:
      - "127.0.0.1:8105:8000"
    command:
      - --stdio
      - uvx chuk-mcp-open-meteo
      - --outputTransport
      - streamableHttp
      - --port
      - "8000"
      - --stateful

  mcp-google:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    container_name: mcp-google
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - mcp-google-data:/root
    environment:
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      USER_GOOGLE_EMAIL: ${USER_GOOGLE_EMAIL}
      OAUTHLIB_INSECURE_TRANSPORT: "1"
      WORKSPACE_MCP_BASE_URI: http://localhost
      WORKSPACE_MCP_PORT: "8000"
      WORKSPACE_MCP_HOST: 0.0.0.0
    entrypoint: ["uvx"]
    command:
      - workspace-mcp
      - --transport
      - streamable-http
      - --single-user
      - --tool-tier
      - extended
      - --tools
      - gmail
      - calendar
      - tasks
      - drive
      - docs

  mcp-calculator:
    image: supercorp/supergateway:uvx
    container_name: mcp-calculator
    restart: unless-stopped
    ports:
      - "127.0.0.1:8106:8000"
    command:
      - --stdio
      - uvx --with "mcp<2" mcp-server-calculator
      - --outputTransport
      - streamableHttp
      - --port
      - "8000"
      - --stateful

  mcp-thinking:
    image: supercorp/supergateway:latest
    container_name: mcp-thinking
    restart: unless-stopped
    ports:
      - "127.0.0.1:8107:8000"
    command:
      - --stdio
      - npx -y @modelcontextprotocol/server-sequential-thinking
      - --outputTransport
      - streamableHttp
      - --port
      - "8000"
      - --stateful

  mcp-rss:
    image: supercorp/supergateway:uvx
    container_name: mcp-rss
    restart: unless-stopped
    ports:
      - "127.0.0.1:8108:8000"
    command:
      - --stdio
      - uvx --with "mcp<2" mcp-server-rss
      - --outputTransport
      - streamableHttp
      - --port
      - "8000"
      - --stateful

  mcp-memory:
    image: supercorp/supergateway:latest
    container_name: mcp-memory
    restart: unless-stopped
    ports:
      - "127.0.0.1:8109:8000"
    volumes:
      - mcp-memory:/data
    environment:
      MEMORY_FILE_PATH: /data/memory.json
    command:
      - --stdio
      - npx -y @modelcontextprotocol/server-memory@2025.4.25
      - --outputTransport
      - streamableHttp
      - --port
      - "8000"
      - --stateful

  mcp-obsidian:
    image: supercorp/supergateway:uvx
    container_name: mcp-obsidian
    restart: unless-stopped
    ports:
      - "127.0.0.1:8110:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OBSIDIAN_API_KEY: ${OBSIDIAN_API_KEY}
      OBSIDIAN_HOST: host.docker.internal
      OBSIDIAN_PORT: "27124"
    command:
      - --stdio
      - uvx --with "mcp<2" mcp-obsidian
      - --outputTransport
      - streamableHttp
      - --port
      - "8000"
      - --stateful

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n-data:/home/node/.n8n
      - ${VAULT_PATH}:/vault
    environment:
      GENERIC_TIMEZONE: Europe/Lisbon
      TZ: Europe/Lisbon
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: fs,path
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      USER_GOOGLE_EMAIL: ${USER_GOOGLE_EMAIL}
    depends_on:
      - mcp-google

  mail-app:
    image: nginx:alpine
    container_name: mail-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:5680:80"
    volumes:
      - ./mail-app/index.html:/usr/share/nginx/html/index.html:ro
      - ./mail-app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - n8n
volumes:
  open-webui:
  vane-data:
  mcp-google-data:
  n8n-data:
  mcp-memory:
