name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # scan the whole history, not only the last commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  n8n:
    name: n8n workflows parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/check-n8n.mjs n8n

  compose:
    name: Docker Compose config is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with the example settings
        run: |
          cp .env.example .env
          docker compose config --quiet

  shell:
    name: Shell scripts (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --severity=warning *.sh

  powershell:
    name: PowerShell scripts (PSScriptAnalyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer (from its GitHub release, not the PowerShell Gallery)
        run: |
          v=1.23.0
          dest="$HOME/.local/share/powershell/Modules/PSScriptAnalyzer/$v"
          mkdir -p "$dest"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/psa.nupkg" \
            "https://github.com/PowerShell/PSScriptAnalyzer/releases/download/$v/PSScriptAnalyzer.$v.nupkg"
          unzip -q "$RUNNER_TEMP/psa.nupkg" -d "$dest"
      - name: Parse and analyze
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer
          ./.github/scripts/check-powershell.ps1