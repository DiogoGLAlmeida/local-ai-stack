server {
  listen 80 default_server;
  return 444;
}
server {
  listen 80;
  server_name localhost 127.0.0.1;
  root /usr/share/nginx/html;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  location = / { try_files /index.html =404; }
  location = /api {
    rewrite ^ /webhook/mail-api break;
    proxy_pass http://n8n:5678;
    proxy_set_header Host mail-app-proxy;
    proxy_read_timeout 600s;
  }
  location / { return 404; }
}
